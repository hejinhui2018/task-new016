<svg xmlns="http://www.w3.org/2000/svg" width="320" height="96" viewBox="0 0 320 96" role="img" aria-label="NOVA 秋季发布会 Logo">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- 枫叶标记 -->
    <circle cx="42" cy="48" r="30" fill="#f08a3c"/>
    <path d="M42 28 C46 38 54 40 60 40 C52 44 50 50 52 58 C46 54 40 54 34 58 C36 50 32 45 24 42 C31 41 38 36 42 28 Z" fill="#fff4e0"/>
    <!-- 主字标 -->
    <text x="86" y="50" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="6" fill="#ffffff">NOVA</text>
    <!-- 分隔线与中文 -->
    <rect x="88" y="60" width="150" height="2" fill="#ffffff" opacity="0.75"/>
    <text x="86" y="82" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="17" letter-spacing="4" fill="#ffffff" opacity="0.92">秋季发布会</text>
  </g>
</svg>
