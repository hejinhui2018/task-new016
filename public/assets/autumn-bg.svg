<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b733"/>
      <stop offset="0.45" stop-color="#e0682b"/>
      <stop offset="1" stop-color="#7a2f1e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.55" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3b22"/>
      <stop offset="1" stop-color="#53200f"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e2d18"/>
      <stop offset="1" stop-color="#3a160a"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a1c0d"/>
      <stop offset="1" stop-color="#241008"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect width="1000" height="1000" fill="url(#sky)"/>
  <!-- 落日（焦点默认区域 620,420 附近） -->
  <circle cx="620" cy="400" r="300" fill="url(#sun)"/>
  <circle cx="620" cy="400" r="120" fill="#ffdf9e" opacity="0.95"/>

  <!-- 远山 -->
  <path d="M0 620 L150 470 L280 560 L430 430 L560 540 L700 450 L860 545 L1000 470 L1000 1000 L0 1000 Z" fill="url(#m1)" opacity="0.85"/>
  <path d="M0 700 L120 580 L260 660 L400 560 L520 650 L660 570 L820 665 L1000 590 L1000 1000 L0 1000 Z" fill="url(#m2)"/>
  <!-- 地面 -->
  <path d="M0 780 Q500 720 1000 780 L1000 1000 L0 1000 Z" fill="url(#ground)"/>

  <!-- 枫树剪影 -->
  <g fill="#2a1006">
    <path d="M120 820 l14 -180 l14 180 z"/>
    <circle cx="134" cy="610" r="70"/>
    <circle cx="90" cy="650" r="46"/>
    <circle cx="180" cy="655" r="50"/>
    <path d="M880 830 l12 -150 l12 150 z"/>
    <circle cx="892" cy="660" r="58"/>
    <circle cx="852" cy="695" r="38"/>
    <circle cx="935" cy="700" r="42"/>
  </g>

  <!-- 飘落的枫叶 -->
  <g fill="#ff9a3c" opacity="0.9">
    <path d="M320 250 l10 6 l-6 10 l-10 -6 z"/>
    <path d="M760 180 l12 7 l-7 12 l-12 -7 z"/>
    <path d="M220 380 l8 5 l-5 8 l-8 -5 z"/>
    <path d="M820 330 l9 5 l-5 9 l-9 -5 z"/>
    <path d="M500 150 l8 5 l-5 8 l-8 -5 z"/>
  </g>
  <g fill="#ffd166" opacity="0.85">
    <circle cx="300" cy="330" r="6"/>
    <circle cx="700" cy="260" r="5"/>
    <circle cx="430" cy="230" r="4"/>
    <circle cx="560" cy="320" r="5"/>
  </g>
</svg>
